# Editor E2E + visual diff against the EmDash preview. Manual only (CI minutes
# budget): GitHub offers the Run button once this file is on the default branch.
# Secrets live only in GitHub, so this is the one place the test can read them.
name: editor-e2e

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://university-emdash-preview.williampote.workers.dev
      visual:
        description: Also run the live-vs-preview visual diff
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Editor E2E
        run: npm run test:editor
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_AUTH: token
          EMDASH_TOKEN: ${{ secrets.UNIVERSITY_E2E_EMDASH_TOKEN }}
          E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.UNIVERSITY_E2E_ACCESS_CLIENT_ID }}
          E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.UNIVERSITY_E2E_ACCESS_CLIENT_SECRET }}
      - name: Visual diff (live vs candidate)
        if: ${{ always() && inputs.visual }}
        run: node visual-diff.mjs --candidate "${{ inputs.base_url }}"
        env:
          E2E_CF_ACCESS_CLIENT_ID: ${{ secrets.UNIVERSITY_E2E_ACCESS_CLIENT_ID }}
          E2E_CF_ACCESS_CLIENT_SECRET: ${{ secrets.UNIVERSITY_E2E_ACCESS_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-out
          path: tests/e2e/out/
          retention-days: 7
